<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BLOCKS</title>
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Blocks">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0b0e'/%3E%3Crect x='12.2' y='7.5' width='7.6' height='4.6' rx='1.3' fill='%23ff6f2e'/%3E%3Crect x='9.8' y='13.7' width='12.4' height='4.6' rx='1.3' fill='%23ff6f2e'/%3E%3Crect x='7.2' y='19.9' width='17.6' height='4.6' rx='1.3' fill='%23ff6f2e'/%3E%3C/svg%3E">
<style>
/* ═══════════ DEPARTURE BOARD ═══════════
   Swiss departure board, ember variant. The system, so a future edit doesn't erode it:
   · Two rule weights only: 1px --border hairline between rows, 2px --border-h paper rule at
     section breaks. Rules bleed full width past the 16px margins. Nothing gets a box it
     doesn't need; structure comes from rules, not cards.
   · Size ladder is 46 / 28 / 20 / 16. Nothing below 16px, ever.
   · Two weights: 500 and 700. Two trackings: 0, and .12em on 16px uppercase labels only.
   · Ember is a FILL colour only, never small coloured text (Lc 50.0 on the ground, under the
     Lc 60 floor). Small accents use --ember-hot (Lc 64.5). ONE ember-filled block on screen
     at a time: the live set's slab. Green is never a second filled block on the session
     screen; it marks logged rows as bare numerals and thin rules.
   · No border-radius, no box-shadow, no gradients, no backdrop-filter, no glow, no grain.
   · Never a condensed face. Helvetica Neue digits are 556/1000 em in every weight here, so
     figures are natively tabular; .num is kept for the Arial fallback. */
:root{
--bg:#0A0A0A;--surface:#121213;--surface2:#2B2B2E;--border:#5E5F62;--border-h:#E6E6E1;
--text:#F5F5F0;--muted:#CDCDC8;
--ember:#ff6f2e;--ember-hot:#ffa14d;--ember-soft:rgba(255,111,46,.12);--ember-line:rgba(255,111,46,.35);
--sage:#79E3A0;--sage-bg:rgba(121,227,160,.1);--sage-line:rgba(121,227,160,.4);
--blue:#A8CDEE;--blue-soft:rgba(168,205,238,.12);--blue-line:rgba(168,205,238,.35);
--danger:#FF9A87;--danger-soft:rgba(255,154,135,.09);--danger-line:rgba(255,154,135,.35);
--f:'Helvetica Neue',HelveticaNeue,Helvetica,Arial,sans-serif;
--fd:var(--f); /* the display face is still a one-line repoint · never condensed */
--ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;touch-action:manipulation;overscroll-behavior-y:none}
button{font-family:var(--f);color:inherit;background:none;border:none;cursor:pointer;font-size:inherit;font-weight:inherit;touch-action:manipulation}
a{color:var(--ember-hot);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--ember-soft)}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
::-webkit-scrollbar{width:12px}
::-webkit-scrollbar-thumb{background:var(--border);border:3.5px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ── chrome · opaque, ruled ── */
.hd{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.hdi{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:13px 16px;padding-top:max(13px,env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wm{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.hbt{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.hbt:active{background:var(--surface2);color:var(--text)}
.tb{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-top:1px solid var(--border)}
.tbi{max-width:560px;margin:0 auto;display:flex;padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.tbb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);font-size:16px;font-weight:500;transition:color .25s}
.tbb svg{display:block}
.tbb .ic{width:52px;height:30px;display:flex;align-items:center;justify-content:center}
.tbb.on{color:var(--ember-hot);font-weight:700}
.tbb.on.navpop .ic{animation:icpop .35s var(--ease)}
@keyframes icpop{45%{transform:scale(1.14)}}
.co{max-width:560px;margin:0 auto;padding:20px 16px calc(96px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.co.nopad{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body:has(.tb~.restc:not(.hide)) .co{padding-bottom:calc(220px + env(safe-area-inset-bottom))} /* while a rest timer bar sits on a tab view, keep the last row clear of it (mirrors the toast rule below) */

/* ── view entrance · one fade on the container, only on view change ── */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.co.fresh{animation:rise .18s var(--ease)}

/* ── banners · full-bleed ruled strips ── */
.co>.ban:first-child{margin-top:-20px}
.ban{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin:0 -16px 16px;padding:13px 16px;font-size:16px;color:var(--muted)}
.ban b{color:var(--text);font-weight:700}
.ban .bba{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
.ban.em{border-left:2px solid var(--ember);padding-left:14px}
.bbtn{font-size:16px;font-weight:700;color:var(--text);padding:11px 14px;border:1px solid var(--border);white-space:nowrap;transition:transform .12s var(--ease)}
.bbtn:active{transform:scale(.95)}
.bbtn.q{border-color:transparent;color:var(--muted)}

/* ── hero ── */
.hero{display:flex;align-items:center;gap:18px;margin:8px 0 24px}
.rw{position:relative;width:72px;height:72px;flex-shrink:0}
.rt{fill:none;stroke:var(--surface2);stroke-width:6}
.rf{fill:none;stroke:var(--ember);stroke-width:6;stroke-linecap:butt;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .6s var(--ease)}
.rf.full{stroke:var(--sage)}
.rn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.rn span{color:var(--muted);font-weight:500;margin-left:2px}
.eyebrow{font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.title{font-size:28px;font-weight:700;letter-spacing:0;line-height:1.1}
.hsub{font-size:16px;color:var(--muted);margin-top:5px}
.hsub .sg{color:var(--sage);font-weight:500}

/* ── week strip ── */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:24px}
.day{background:var(--surface);border:1px solid transparent;padding:9px 2px 11px;text-align:center;position:relative;transition:border-color .2s,transform .15s var(--ease)}
.day:active{transform:scale(.94)}
.day .dl{font-size:16px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:3px}
.day .dw{font-size:16px;font-weight:500;color:var(--text);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.off .dw{color:var(--muted)}
/* today is a lit cell, the same language as the segmented control's active state · never a
   thin outline, which reads as a focus ring rather than a designed state */
.day.on{background:var(--text)}
.day.on .dl,.day.on .dw{color:var(--bg)}
.day .td{position:absolute;top:5px;right:5px;width:5px;height:5px;background:var(--ember)}
.day .cd{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:14px;height:3px;background:var(--sage)}

/* ── sections · 2px paper rule, full bleed ── */
.sl{display:flex;align-items:baseline;gap:10px;margin:32px -16px 12px;padding:0 16px 7px;border-bottom:2px solid var(--border-h)}
.sl:first-child{margin-top:0}
.sl .lt{font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.sl .rule{flex:1}
.sl .cnt{font-size:16px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.xrm{position:relative;background:none;border:none;color:var(--muted);font-size:18px;line-height:1;padding:0 4px;cursor:pointer}
.xrm::after{content:'';position:absolute;inset:-13px -10px}
.sl.done .lt,.sl.done .cnt{color:var(--sage)}
.note{font-size:16px;color:var(--muted);line-height:1.5;margin:-2px 0 12px}
.note:empty{display:none} /* an unset Morning/Evening note must not reserve a phantom gap */

/* ── cards flattened · plain blocks, structure comes from the section rules ── */
.card{padding:2px 0 6px;margin-bottom:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;font-size:20px;font-weight:700;transition:transform .15s var(--ease),opacity .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn-p{background:var(--ember);color:#0A0A0A}
.btn-o{border:1px solid var(--border);color:var(--text)}
.btn-d{color:var(--danger);border:1px solid var(--danger-line)}
.scard-t{font-size:20px;font-weight:700;line-height:1.25}
.scard-m{font-size:16px;color:var(--muted);margin:3px 0 14px}
.lnk{font-size:16px;font-weight:700;color:var(--ember-hot);padding:11px 2px;display:inline-block}
.sl .lnk{padding:10px 8px;margin:-10px -8px}
.lnk:active,.savedl .ed:active,.rowx:active,.vl:active,.xrm:active,.prmin:active{opacity:.55}
.btn-q{color:var(--muted)}

/* ── check rows · ruled, full bleed ── */
.ck{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);margin:0 -16px;padding:12px 16px;min-height:56px;user-select:none;-webkit-user-select:none;transition:background .2s}
.ck:active{background:var(--surface2)}
.ck.ro{pointer-events:none} /* reference-only rows must not offer a press state they can't honour */
.ck.ro .vl{pointer-events:auto;display:inline-flex;align-items:center;min-height:44px;padding:0 10px;margin:-11px -6px -11px 0}
.ck.done{border-left:2px solid var(--sage);padding-left:14px}
.cb{width:27px;height:27px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--bg);transition:background .2s,border-color .2s}
.cb svg{width:14px;height:14px}
.cb path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .25s ease .04s}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
.ck.done .cb,.mc.done .cb,.hb.on .cb{background:var(--sage);border-color:var(--sage);animation:pop .3s var(--ease)}
.ck.done .cb path,.mc.done .cb path,.hb.on .cb path{stroke-dashoffset:0}
.ckm{flex:1;min-width:0}
.ckn{font-size:16px;font-weight:500;line-height:1.3}
.ck.done .ckn{color:var(--muted)}
.ckr{font-size:16px;color:var(--muted);margin-top:2px;line-height:1.45}
.vl{font-size:16px;font-weight:700;color:var(--ember-hot);white-space:nowrap;display:inline-block;padding:9px 8px;margin:-9px -4px -9px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
.mc{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--border);min-height:48px;user-select:none;-webkit-user-select:none;transition:background .2s}
.mc:active{background:var(--surface)}
.mc .cb{width:24px;height:24px}
.mc .cb svg{width:12px;height:12px}
.mcn{font-size:16px;color:var(--text);line-height:1.35}
.mc.done .mcn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--sage-line)}
@media(max-width:480px){.mgrid{grid-template-columns:1fr}}

/* ── daily habits ── */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:6px}
.hb{background:var(--surface);border:1px solid transparent;padding:13px 14px 12px;user-select:none;-webkit-user-select:none;transition:border-color .2s,transform .15s var(--ease)}
.hb:active{transform:scale(.97)}
.hb.on{border-color:var(--sage-line)}
.hbtop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.hbic{color:var(--muted);display:flex;flex-shrink:0;transition:color .2s}
.hb.on .hbic{color:var(--sage)}
.hbl{font-size:16px;font-weight:500;flex:1;min-width:0}
.hb .cb{width:24px;height:24px}
.hb .cb svg{width:12px;height:12px}
.hbs{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.hbs b{font-weight:700}
.hb.on .hbs{color:var(--sage)}
.bedstat{display:flex;align-items:center;gap:13px;padding:14px 16px;margin-bottom:10px}
.bsf{display:flex;align-items:center;flex-shrink:0;color:var(--muted);transition:color .2s}
.bsf.on{color:var(--ember-hot)}
.bsn{font-size:20px;font-weight:500}
.bsn b{color:var(--ember-hot);font-weight:700}
.bss{font-size:16px;color:var(--muted);margin-top:1px}

/* ── session header · opaque, ruled ── */
.shd{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.shdi{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:12px 12px;padding-top:max(12px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.shd .bk{min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.shd .bk:active{background:var(--surface2);color:var(--text)}
.shm{flex:1;min-width:0}
.sht{font-size:20px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shs{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
/* Finish is a bounded text control, NOT an ember fill: on the session screen the live slab is
   the one filled block, and the header must not compete with it. Scoped to button · .fin is
   also the "exercise complete" modifier on .exc (a div). */
button.fin{border:1px solid var(--border-h);color:var(--text);font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:12px 14px;flex-shrink:0;transition:transform .12s var(--ease),background .15s}
button.fin:active{transform:scale(.96);background:var(--surface2)}
button.fin.q{border-color:var(--border);color:var(--muted)}

/* ── exercise sections & set rows · the board itself ── */
.exc{border-top:2px solid var(--border-h);margin:14px -16px 0;padding:14px 16px 8px;transition:border-color .35s}
.sl+.exc{border-top:none;margin-top:0;padding-top:4px} /* the section label above already drew the paper rule */
/* a finished exercise keeps full ink forever · done is a 2px green rule down the left edge */
.exc.fin{border-left:2px solid var(--sage);padding-left:14px}
.exh{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.exh .tpes{color:var(--muted);font-weight:700}
/* the name identifies, the numbers are what you act on · medium name, bold numerals */
.exn{font-size:20px;font-weight:500;flex:1;min-width:0;line-height:1.25}
.chip{font-size:16px;font-weight:700;letter-spacing:.12em;flex-shrink:0;text-transform:uppercase}
.chip.em{color:var(--ember-hot)}
.chip.bl{color:var(--blue)}
.chip.off{color:var(--muted)}
.chip.rest{text-transform:none;letter-spacing:0}
button.chip{position:relative;border:1px solid var(--border);color:var(--muted);padding:3px 8px}
button.chip::after{content:'';position:absolute;inset:-12px -6px}
.exs{font-size:16px;color:var(--muted);margin-bottom:2px}
.ghost{font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
.ghost b{color:var(--muted);font-weight:700}
/* one shared grid for the column caps and every set row · the caps are drawn ONCE per session */
.cols{display:grid;grid-template-columns:40px 1.35fr 1fr 56px;gap:6px;margin:2px -16px 0;padding:0 16px 7px;border-bottom:1px solid var(--border)}
.cols span{font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;text-align:center}
.cols span:first-child{text-align:left}
.sr{display:grid;grid-template-columns:40px 1.35fr 1fr 56px;gap:6px;align-items:center;margin:0 -16px;padding:6px 16px;border-bottom:1px solid var(--border)}
.sr.edit{background:var(--surface2)}
.srn{font-size:16px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;text-align:left}
.sr.wu .srn{color:var(--blue)}
/* steppers lose their pills · bare glyphs at the row edges, the well is bounded by the row rules */
.stp{display:flex;align-items:stretch;height:56px}
.stb{width:34px;position:relative;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:26px;font-weight:500;flex-shrink:0;user-select:none;-webkit-user-select:none;transition:background .15s,color .15s}
.stb:active{color:var(--text)}
.stb::after{content:'';position:absolute;top:0;bottom:0;left:-6px;right:-6px}
/* expand outward only · the inward 6px used to eat the value's own tap-to-type target */
.stp>.stb:first-child::after{left:-8px;right:0}
.stp>.stb:last-child::after{left:0;right:-8px}
/* a standalone stepper (sheets, cardio fields) has no row rules around it · it keeps a bounding rule */
.fld .stp,.strow .stp,.sheet .stp{border:1px solid var(--border)}
/* optical centring · HN seats the math-axis glyphs (+ − ↑ ↓ ‹ ›) 0.11-0.17em below a flex-centred
   box's true centre (ascent-heavy line box vs the glyph's low maths axis) · the asymmetric bottom
   padding re-seats the ink on the centre · values measured per class via canvas actualBoundingBox
   against the border box (Aug 2026), not eyeballed · ✕ and digits reach cap height and need none */
.stb,.setb{padding-bottom:6px}
.exmv{padding-bottom:7px}
.mvb{padding-bottom:5px}
.calnav button{padding-bottom:4px}
.car2{position:relative;top:-2px}
.stv{flex:1;display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;min-width:0;letter-spacing:0;transition:background .15s}
.stv.tick{animation:vtick .2s var(--ease)}
.stv:active{background:var(--surface2)}
@keyframes vtick{from{transform:scale(1.22)}}
.vin{width:100%;background:transparent;border:none;color:var(--text);font-size:28px;line-height:1;font-weight:700;letter-spacing:0;text-align:center;font-family:var(--f);font-variant-numeric:tabular-nums}
.vin:focus{outline:none}
/* the log check on a non-live row · bare muted glyph, present but plainly recessed.
   .go is the committed accent (edit-save, sprint live rep) · ember-hot, never ember text */
.lg{height:56px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .12s var(--ease),color .15s}
.lg svg{width:22px;height:22px}
.lg:active{color:var(--text);transform:scale(.93)}
.lg.go{color:var(--ember-hot)}
.lg.fut{color:var(--muted)}
.sr.wu .lg{color:var(--blue)}
.sr.done{background:none}
.sr.done .srn{color:var(--muted)}
.sr.done.new{animation:srin .55s var(--ease)}
@keyframes srin{from{background:rgba(121,227,160,.3);transform:scale(.97)}}
/* a logged value is the permanent record · full size, green ink, never shrunk, never faded */
.sr.done .dtx{font-size:28px;line-height:1;font-weight:700;color:var(--sage);font-variant-numeric:tabular-nums;grid-column:2/4;text-align:center}
.sr.done .dck{height:44px;display:flex;align-items:center;justify-content:center;color:var(--sage)}
.sr.done .dck svg{width:18px;height:18px}
/* ── the live set · a full-bleed ember slab, the one filled block on screen, and it IS the
   commit target. 96px tall, black 46px numerals · Lc 51.8 as a 46px/700 display pair. ── */
.sr.live{border-bottom:none}
.slab{display:flex;align-items:center;justify-content:center;gap:14px;width:calc(100% + 32px);margin:0 -16px;height:96px;background:var(--ember);color:#0A0A0A;font-size:46px;font-weight:700;line-height:1;border-bottom:1px solid var(--border);transition:transform .12s var(--ease),background .15s}
.slab:active{background:var(--ember-hot);transform:scale(.99)}
.slab svg{width:26px;height:26px;flex-shrink:0} /* the log check rides the slab so it reads as a button, not a readout */
.setb{width:48px;height:48px;border:1px solid var(--border);color:var(--muted);font-size:26px;font-weight:500;display:flex;align-items:center;justify-content:center;margin:2px 0 4px;transition:background .15s,color .15s}
.setb:active{background:var(--surface2);color:var(--text)}

.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;animation:fdin .22s ease}

@keyframes fdout{to{opacity:0}}

.sheet{position:relative;width:100%;max-width:560px;background:var(--surface);border-top:2px solid var(--border-h);padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:shup .3s var(--ease);max-height:86vh;overflow-y:auto;overscroll-behavior:contain}

.shbtns{display:flex;flex-direction:column;gap:9px;margin-top:16px}

.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(6px);bottom:calc(92px + env(safe-area-inset-bottom));z-index:90;background:var(--surface2);border:1px solid var(--border-h);color:var(--text);font-size:16px;font-weight:500;padding:12px 18px;display:flex;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .28s,transform .32s var(--ease);max-width:min(92vw,420px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.toast.show .tb2{pointer-events:auto}
body:has(.tb~.restc:not(.hide)) .toast{bottom:calc(220px + env(safe-area-inset-bottom))} /* clear the rest bar instead of landing on top of it */
body:has(.restc:not(.hide)):not(:has(.tb)) .toast{bottom:calc(150px + env(safe-area-inset-bottom))} /* session views have no tab bar · keep the same gap above the floor-level bar */
.toast .tb2{color:var(--ember-hot);font-weight:700;font-size:16px;padding:12px 10px;margin:-12px -10px -12px -6px}

ex('s1','Landmine Press (half-kneeling)',0,120,['shoulders','chest']),

/* ── Preloaded common-exercise library (cx_*) — added contentRev 9. Picker sorts by usage, so these sit below your active lifts. ── */
/* Chest */

{t:'Sprint Program',b:`**By feel · 1×/week (Friday) · build top speed first, extend later · 100m now, 200 later (track available).**
Speed is the anchor you enjoy, not a number to chase. Your **season** (the quarterly dial in Program) sets the mood; on a sprint day you pick one option from that season's short menu. Nothing auto-advances, you choose what fits the day. All chips are equal · there is no suggested default and no highlighted pick.
**Running is exactly two things now** (Aug 2026)
- Sprints, and later speed endurance. Nothing continuous, ever. Ceiling of **400m** in any single rep, and that is an outer bound, not a target.
- Zone 2 is the bike or the pool. Running is no longer an aerobic modality in this program at all.
- **The one exception on foot is Friday's dynamic warm-up**: 30-45 min of skips, A / B, dribbles and easy strides, sitting at 125-155 bpm the whole way. That is zone 2 by heart rate, and it is the sprint day's aerobic work as well as its warm-up. It is broken work with a walk in it, not continuous running, which is why it does not contradict the line above. It logs as one row, on purpose · the drills are the content, not a checklist to tick through.
**About the season dial, honestly**
- You are on **Speed**, and have been since a migration set every existing install to it. That is the only menu carrying the near-max picks, and your calf floor is banked, so max-velocity fly, acceleration and Special Endurance I are all unlocked right now.
- The dial does not cap anything. The effort field is a free stepper, so no season has ever prevented a 95% Friday. It picks which four chips you see, nothing more.
- Three of the fourteen chips repeat another season's numbers, but none repeats its NAME: the same dose carries a different intent in a different season (a 4 × 20m @ 80% is "short technical acceleration" in Build and "maintenance acceleration" in Lean). That is the dial working, not redundancy. Flattening the four menus into one was considered and rejected Aug 2026.
- The one label that is genuinely wrong is **Lean**, named after a goal that was dropped as a training goal (leanness is ~80% diet). What that season actually describes is pool-forward maintenance, which is exactly the Hua Hin mode · rename it at the move rather than deleting it.
**The seasons**
- **Build**: legs are heavy in the gym, so sprint stays low-CNS. Run-throughs, short accels, extensive tempo. Nothing over 80%.
- **Speed**: legs light, sprint peaks. Sub-max fly is the always-open pick; max-velocity fly, acceleration, and Special Endurance I are near-max and gated (one hard pick a week). 95% working ceiling; true all-out is a rare in-taper time-trial only.
- **Reset**: deload. Movement-quality flow, easy run-throughs. All sub-75%.
- **Lean**: pool-forward maintenance. One light accel to hold fast-twitch; the rest optional.

{t:'Sprint Rationale & Sources',b:`**Short-to-long; build max velocity then extend it; polarize intensity — fast (≥95%) or easy (<70%), not chronic medium tempo.** Haugen et al., elite sprint development review. [Sports Med Open](https://pmc.ncbi.nlm.nih.gov/articles/PMC6872694/)
**Volume before intensity — most meters at low effort, fewer as speed rises; progress on soreness, not rep counts** (50%/1:3 → 75%/1:5 → 90-100%/1:7). [Return to sprinting after injury](https://pmc.ncbi.nlm.nih.gov/articles/PMC7134353/)
**Read that line as WITHIN a session, not across the plan.** It describes how one sprint day is built (warm-up, run-throughs, build-ins, then the fast reps). It is NOT an argument for banking continuous easy running first — for a soleus, running volume is the LAST box, not the first, because soleus is most vulnerable once fatigued. That is the opposite of a hamstring, where intensity is the risky frontier. Getting these two backwards is where the felt contradiction in this app came from.
**~8-week floor before near-max** — the floor is a starting line, not a finish. ~13-21% recur over 2 years. **Corrected framing: you are inside the high-risk window, not past it.** In the AFL registry (563 calf strains), restricted to post-recovery injuries, the 2-6 month bucket is the LARGEST (30.9-32.3%) against 19.7-22.5% for 0-2 months, and that clock runs from injury date. As of Aug 2 2026 you were past week 14 with 8+ weeks of fast running banked, which puts you SQUARELY INSIDE that 2-6 month bucket, not approaching it. The gate opening was the app running out of things to protect you from, not the risk passing. (Dated on purpose · the old line hardcoded "~13-14 weeks", which was already stale the week it shipped, and this app holds no injury date to compute from.) [Calf strains review](https://link.springer.com/article/10.1186/s40798-025-00960-4) · [AFL recurrence](https://pmc.ncbi.nlm.nih.gov/articles/PMC12410626/)
**Soleus gate before 200/400** — the old line here ("~90% of recurrent calf strains are soleus") could not be traced to any source and has been removed, and the link that sat beside it was never its source. What IS supported: across 8 seasons of an elite track & field cohort (Kelly et al.), soleus carried the highest incidence, the highest burden and the highest recurrence of any calf structure. Loaded most under fatigue. **No link here on purpose** — that paper is not the one linked below, and a citation is worth nothing pointing at the wrong place.
**What the linked calf paper actually is** — Green et al. 2022, in-depth interviews with 20 expert sports clinicians. Practice and perspective, not epidemiology. It is the source for most of the return-to-running judgement in this app, and it is Level 5 evidence. [Green et al. · 20 expert clinicians](https://pmc.ncbi.nlm.nih.gov/articles/PMC8761182/)
**Fast running is NOT calf-sparing** — peak soleus force RISES with speed, up to ~7 m/s. Friday's sub-max flys are the highest per-step soleus load of the week; the only thing protecting you is how few of them there are. What makes long slow running the larger exposure is stride count and accumulated fatigue, since soleus work per stride is roughly flat across speeds. Dose the calf in strides, not in heart rate.
**Bent-knee work does NOT load soleus harder** — the standard claim was refuted by better sources. Bending the knee cuts plantarflexion torque ~31% and gastroc EMG ~35% (Kovacs 2024, n=30), and soleus hypertrophy is statistically indistinguishable seated vs standing (Kinoshita 2023, +2.1% vs +2.9%, p=0.410). Your straight-knee work already trains soleus. **The gap was LOAD, not knee angle** — 15 lb is ~8% of bodyweight, sitting under the ~70% threshold where tendon stiffness actually adapts (Bohm meta-analysis: effect size 0.90 above vs 0.04 below). Bent-knee still goes in, for specificity and load-sharing, and because it is the position every published benchmark is written in.
**Post-session "feels fine" is not a safety signal** — exercise raises local pressure-pain thresholds 15-20% for 5-30 minutes, so the read straight after a session is partly analgesic artifact. Expert clinicians explicitly do not use symptom-free running as a calf clearance guide; the reported failure mode is "good, good, good, then no good," with no prodrome. The next morning is the honest read, which is why the app now asks for it.
**Absolute injured-leg gate, not L/R symmetry** — your injured calf is your dominant (stronger) side, so symmetry overstates recovery. [Calf rehab](https://e3rehab.com/calf-muscle-strain-injury/)
**One sprint day, high-low week** — equal-volume 1×/week matched 2× for speed/power (under-delivers for endurance — matters if you push the 400). [1× vs 2×](https://pubmed.ncbi.nlm.nih.gov/34079162/) · [high-low](https://www.sprintcoach.com/blog/revisiting-the-high-low-concept-of-training)
**"Stop when form breaks"** — technique degrades before measurable speed does. The "~3-4% velocity drop-off" figure that sat here was removed Aug 2026: the page it was cited to contains no such number, and the only threshold on it is a 10% velocity loss for ending a BARBELL set, which is a different construct. Same failure as the "28% power loss" claim removed earlier. The rule needs no number and you measure no velocity anyway.
**Honest caveats**
- One Friday can't reach the weekly max-velocity "protective dose" — safety rests on per-rep quality + the pain gate + your year-round strength/plyo base.
- The 1×-vs-2× study was youth soccer, not a returning masters sprinter — directional, not exact.
- Scheduling, deload rhythm, and by-feel cues are coaching convention, not RCT-proven for your profile.
- Most of the return-to-running guidance here is **Level 5 expert opinion** (clinician consensus surveys), not trial evidence. It is the best available for a soleus strain and it is still opinion.
- The 8-12 week build and the ~0.3 × bodyweight capacity target are clinical convention. Your physio owns the final number.`},
{t:'Plyometric Progression',b:`Earn the right to be reactive by first proving you can absorb. Count contacts not sets · start ~40-60 quality contacts. **Stop when the contacts get loud** · that rule is self-limiting at once-weekly frequency and is what actually governs the session. (The old "increase ≤10-20%/wk" ceiling was removed Aug 2026: no trial supports it, and the analogous 10%-per-week rule for running volume was tested directly and came back null.)
A low-contact primer immediately BEFORE sprints is potentiation, not a collision · that is where it lives now. The old "never back-to-back with sprint work" rule was written for a separate standalone plyo session, and that is still true of one.
The four rungs that are also carded exercises (heavy deficit raises, bent-knee raises, fast calf raises, pogos) live on their own cards with fuller cues · this table is the map, not the prescription.

{t:'How the Tear Heals',b:`**Phase 1 — Destruction · Hours 0-48.** Torn fibers retract. Hematoma forms scaffold. Neutrophils (hrs 1-24), macrophages (hrs 24-72) secrete growth factors activating satellite cells.
**Phase 2 — Repair · Days 3-21.** Satellite cells fuse into myotubes bridging the gap. Fibroblasts lay Type III collagen — weak, disorganized. Grade II gap too large to fully bridge; scar fills the rest.
**Phase 3 — Remodeling · Weeks 3-6+ months.** Type III → Type I collagen, organized along stress lines. Concentric = moderate stress. Eccentric = highest demand — remodeling stimulus if mature, re-tear if too early. **You are past this** · Gate 3a is cleared and 3s eccentrics at load are the current prescription, not a caution.
**Why re-tears happen.** Scar is stiffer than original muscle. The junction between scar and healthy tissue is the weakest link — re-tears happen at the margins. Bulletproofing = surrounding tissue strong enough that the junction never sees failure-threshold forces.`},

/* ── Daily Block → Full Mobility Routine · a daily item ticked on a mobility day also ticks its routine duplicate (matched by name, dose stripped). Auto-fills live in days[dk].amob so unticking the daily item only retracts what it filled — a hand-ticked routine item stays. ── */
function normCk(n){return String(n||'').toLowerCase().split('—')[0].split('·')[0].replace(/[^a-z0-9]/g,'')}
function mobToday(dk){const t=tplForDate(dk);return!!(t&&t.kind==='cardio'&&(t.checks||[]).some(c=>c.enabled&&c.link==='mobility'))}
function mobMatches(did){const dd=prog().checklists.daily.find(x=>x.id===did);if(!dd)return[];const n=normCk(dd.name);if(!n)return[];
const out=[];prog().checklists.mobility.forEach(g=>(g.items||[]).forEach(it=>{if(normCk(it.name)===n)out.push(it.id)}));return out}
function syncMob(dk,d,cid,on){
const did=cid.indexOf('pm:')===0?cid.slice(3):cid;
if(!prog().checklists.daily.some(x=>x.id===did))return;
const ids=mobMatches(did);if(!ids.length)return;
if(on){if(!mobToday(dk))return; /* fill only on a mobility day · retraction below runs regardless, so a day swap can't strand an auto mark */
let n=0;ids.forEach(m=>{if(!d.c.includes(m)){d.c.push(m);(d.amob=d.amob||[]).push(m);n++}});
if(n)toast('Also ticked in the mobility routine')}
else ids.forEach(m=>{if(!(d.amob||[]).includes(m))return;
const still=prog().checklists.daily.some(x=>(d.c.includes(x.id)||d.c.includes('pm:'+x.id))&&mobMatches(x.id).includes(m)); /* any still-ticked daily item covering this routine item keeps it */
if(!still){d.c=d.c.filter(x=>x!==m);d.amob=d.amob.filter(x=>x!==m)}})}

function bedTime(){return DB.settings.bedtime||'22:00'}
function fmtTime12(t){const[h,m]=t.split(':').map(Number);let hh=h%12;if(!hh)hh=12;return hh+':'+String(m).padStart(2,'0')+' '+(h<12?'AM':'PM')}

function habitOn(dk,key){return!!(DB.days[dk]&&DB.days[dk][key])}

/* Sundays are sacred: untracked by default, and never break a streak. A record is Sunday-neutral
   when the day you'd naturally tap it lands on a Sunday (bed logs the previous night, so Saturday
   nights are tappable only on Sunday) — absent neutral records are skipped, not counted as misses. */
function sunNeutral(dk,off){return dowOf(shiftDk(dk,-(off||0)))===0}
function sunTracked(dk){return dowOf(dk)!==0||!!(DB.days[dk]&&DB.days[dk].sunOn)||sessionsFor(dk).length>0}
function sunOverride(dk){const d=DB.days[dk]=DB.days[dk]||{c:[]};d.sunOn=true;sv();vibe(10);rn()}
function sunRest(dk){const d=DB.days[dk];if(d)delete d.sunOn;sv();rn()}
function habitStreak(key){const off=habitDef(key).off||0;let n=0,d=habitDate(key);if(!habitOn(d,key))d=shiftDk(d,-1);
while(true){if(habitOn(d,key)){n++;d=shiftDk(d,-1)}else if(sunNeutral(d,off)){d=shiftDk(d,-1)}else break}return n}
function habitBest(key){const off=habitDef(key).off||0;const ks=Object.keys(DB.days).filter(dk=>DB.days[dk][key]).sort();
if(!ks.length)return 0;let best=0,run=0,d=ks[0],end=ks[ks.length-1];
while(d<=end){if(habitOn(d,key)){if(++run>best)best=run}else if(!sunNeutral(d,off))run=0;d=shiftDk(d,1)}return best}
function habitInner(key){const def=habitDef(key);
if(def.streak){const n=habitStreak(key);
 if(n>0)return'<b>'+n+'</b>&nbsp;night'+(n>1?'s':'')+' in a row';
 return habitToday(key)?'Logged':'Last night?'}
return habitToday(key)?'Logged today':'Tap to log'}

/* Bounds for a pending set value, one table for every path that writes one · the +/− stepper and the
   tap-to-type field both clamp through here, so they can never disagree. w/r are the old
   weight × reps fields; h/e are an iso row's seconds and effort %, which need a ceiling as well as a
   floor (an effort of 250% is not a thing). */
const PV_BOUNDS={w:[0,1e5],r:[1,1000],h:[5,600],e:[10,100]};
function pvClamp(f,v){const b=PV_BOUNDS[f]||[0,1e5];return Math.min(b[1],Math.max(b[0],v))}
function fmtVal(key,f,bw){const p=PV[key]||{};return f==='w'?fmtW(p.w,bw):f==='h'?(+p.h||0)+'s':f==='e'?(+p.e||0)+'%':String(p.r)}
function stepPV(key,f,d,bw){const p=PV[key];if(!p)return;
p[f]=pvClamp(f,Math.round(((+p[f]||0)+d)*10)/10);
setV(document.getElementById('v-'+key+'-'+f),fmtVal(key,f,bw));updSlab(key)}
function editPV(key,f,el,bw){if(el.querySelector('input'))return;const p=PV[key];if(!p)return;
const cur=+p[f]||0;
el.innerHTML='<input class="vin num" type="text" inputmode="decimal" value="'+(cur||'')+'">';
const inp=el.firstChild;inp.focus();try{inp.select()}catch(e){}
const commit=()=>{const n=parseFloat(inp.value);p[f]=isNaN(n)?cur:pvClamp(f,n);el.textContent=fmtVal(key,f,bw);updSlab(key)};
inp.addEventListener('blur',commit);
inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()})}
function stepGroup(key,f,step,bw){
return'<div class="stp"><button class="stb" data-hold data-fn="stepPV" data-args=\''+JSON.stringify([key,f,-step,bw])+'\'>−</button>'
+'<div class="stv num" id="v-'+key+'-'+f+'" onclick="editPV(\''+key+'\',\''+f+'\',this,'+bw+')">'+fmtVal(key,f,bw)+'</div>'
+'<button class="stb" data-hold data-fn="stepPV" data-args=\''+JSON.stringify([key,f,step,bw])+'\'>+</button></div>'}
function seedPV(key,ex,entry,i,sess){if(PV[key])return;
const p=prefill(entry,ex,i,sess);PV[key]={w:p.w,r:p.reps}}
/* after a commit the next slab renders in nearly the same spot, so a fast double-tap would log
   two sets with prefill values · consecutive SLAB commits inside 400ms are one tap. The small
   per-row checks stay on logSet directly, so deliberate out-of-order logging is untouched. */
let SLAB_T=0;
function slabLog(exId,i){const n=Date.now();if(n-SLAB_T<400)return;SLAB_T=n;logSet(exId,i)}
function slabTxt(key,bw){const p=PV[key]||{};return((+p.w>0)?fmtVal(key,'w',bw)+' × ':'')+String(p.r||'')} /* zero load is reps-only, matching setTxt on the done rows · never "0 × 8" */
function updSlab(key){const el=document.getElementById('sv-'+key);if(!el)return;el.textContent=slabTxt(key,el.dataset.bw==='1')}
function pendRow(ex,entry,i,sess,live){
const key=ex.id+'_'+i;
seedPV(key,ex,entry,i,sess);
const isWu=i<entry.warmups,wIdx=i-entry.warmups+1,wstep=unit()==='kg'?2.5:5;
const row='<div class="sr'+(isWu?' wu':'')+(live?' live':'')+'"><div class="srn num">'+(isWu?'W':wIdx)+'</div>'
+stepGroup(key,'w',wstep,ex.bw)+stepGroup(key,'r',1,false)
+(live?'<span></span>':'<button class="lg" id="lg-'+ex.id+'-'+i+'" onclick="logSet(\''+ex.id+'\','+i+')" aria-label="Log set">'+CHECK+'</button>')+'</div>'; /* stable id · lets rn() hand focus to the next pending set instead of dropping it */
if(!live)return row;
/* the live set's data line is followed by the full-bleed slab, and the slab IS the commit target ·
   it carries the same log check the row buttons use (outside the sv- span, so updSlab can't wipe it) */
return row+'<button class="slab num" id="lg-'+ex.id+'-'+i+'" onclick="slabLog(\''+ex.id+'\','+i+')" aria-label="Log set"><span id="sv-'+key+'" data-bw="'+(ex.bw?'1':'0')+'">'+slabTxt(key,ex.bw)+'</span>'+CHECK+'</button>'}
function doneRow(ex,entry,st){
const wIdx=(st.n-1)-entry.warmups+1;
return'<div class="sr done'+(st.warmup?' wu':'')+(S.flash===ex.id+'_'+st.n?' new':'')+'" onclick="editLogged(\''+ex.id+'\','+st.n+')"><div class="srn num">'+(st.warmup?'W':wIdx)+'</div>'
+'<div class="dtx num">'+setTxt(st,ex.bw)+'</div><div class="dck">'+CHECK+'</div></div>'}
function editRow(ex,entry,st){
const key='e_'+ex.id+'_'+st.n;
if(!PV[key])PV[key]={w:wInUnit(st.w),r:st.reps};
const isWu=!!st.warmup,wIdx=(st.n-1)-entry.warmups+1,wstep=unit()==='kg'?2.5:5;
return'<div class="sr edit'+(isWu?' wu':'')+'"><div class="srn num">'+(isWu?'W':wIdx)+'</div>'
+stepGroup(key,'w',wstep,ex.bw)+stepGroup(key,'r',1,false)
+'<button class="lg go" onclick="updateSet(\''+ex.id+'\','+st.n+')" aria-label="Save set">'+CHECK+'</button></div>'
+'<div style="display:flex;justify-content:flex-end;gap:2px;padding:2px 2px 4px"><button class="rowx" onclick="removeSet(\''+ex.id+'\','+st.n+')">Remove set</button><button class="rowx" style="color:var(--muted)" onclick="cancelEdit()">Cancel</button></div>'}
/* the ONE ember slab on screen · the next pending set of the exercise you are actually in:
   the exercise of the most recently logged set while it still has pending rows, else the
   first exercise (in session order) with a pending row. Enforced here, in code, because the
   slab only reads as a signal if it is the only filled block on the screen. */
function liveKeyOf(sess,entries){
const pend=e=>{const byN={};workingSets(sess,e.exId).forEach(x=>{byN[x.n]=x});
 const tot=rowTotal(sess,e);for(let i=0;i<tot;i++)if(!byN[i+1])return i;return -1};
let lastEx=null,lastTs=0;
sess.sets.forEach(x=>{if(x.ts>=lastTs){lastTs=x.ts;lastEx=x.exId}});
if(lastEx){const e=entries.find(x=>x.exId===lastEx);
 if(e){const i=pend(e);if(i>=0)return e.exId+'_'+i}}
for(const e of entries){const i=pend(e);if(i>=0)return e.exId+'_'+i}
return null}
function vSession(){
const sess=sessById(S.sid);
if(!sess){S.view='tabs';return vTabs()}
const entries=entriesOf(sess);
const liveKey=S.amend?null:liveKeyOf(sess,entries); /* an edit of a past day has no live set and no slab */
let body='<div class="cols"><span>Set</span><span>Load</span><span>Reps</span><span></span></div>'; /* the column caps are drawn ONCE per session, not once per exercise */
entries.forEach((entry,ei)=>{
const ex=exOf(entry.exId),logged=workingSets(sess,entry.exId).sort((a,b)=>a.n-b.n);
const maxN=logged.length?logged[logged.length-1].n:0;
const total=rowTotal(sess,entry);
const fin=logged.length>=total&&total>0;
let rows='';
const byN={};logged.forEach(x=>{byN[x.n]=x});
for(let i=0;i<total;i++){const st=byN[i+1];
 if(st&&S.editKey===entry.exId+'_'+st.n)rows+=editRow(ex,entry,st);
 else if(st)rows+=doneRow(ex,entry,st);
 else rows+=pendRow(ex,entry,i,sess,liveKey===entry.exId+'_'+i)}
body+='<div class="exc'+(fin?' fin':'')+'"><div class="exh"><div class="exn">'+esc(ex.name)
+(ex.video?' <a class="vl" href="'+ex.video+'" target="_blank" aria-label="Watch video">▶</a>':'')+'</div>'
+(entry.amrap?'<span class="chip em">max</span>':'')
+'<button class="chip off rest num" onclick="restSheet(\''+entry.exId+'\')" aria-label="Rest '+restFor(entry,ex)+' seconds · tap to change">'+restFor(entry,ex)+'s</button>'
+'<span class="tpes num">'+logged.length+'/'+total+'</span></div>'
+'<div class="exs">'+esc(schemeEng(entry,sess.date))+(entry.cue?' · '+esc(entry.cue):'')+'</div>'
+ghostLine(ex,sess)
+rows
+'<div class="exf"><div style="display:flex;align-items:center;gap:8px"><button class="setb" onclick="addRow(\''+entry.exId+'\')" aria-label="Add set">+</button>'+(total>1?'<button class="setb" onclick="rmRow(\''+entry.exId+'\')" aria-label="Remove set">−</button>':'')+'</div><div style="display:flex;align-items:center;gap:5px;margin-left:auto">'+(entries.length>1?'<button class="exmv" onclick="moveEx(\''+entry.exId+'\',-1)"'+(ei===0?' disabled':'')+' aria-label="Move up">↑</button><button class="exmv" onclick="moveEx(\''+entry.exId+'\',1)"'+(ei===entries.length-1?' disabled':'')+' aria-label="Move down">↓</button>':'')+'<button class="exrm" onclick="rmExAsk(\''+entry.exId+'\')">Remove</button></div></div></div>'});
body+='<button class="addb" onclick="pickExFor(\'session\')">+ Add exercise</button>';
const elapsed=S.amend?fmtDk(sess.date):'<span id="elap">'+mmss(Date.now()-sess.startedAt)+'</span>';
const hd='<div class="shd"><div class="shdi"><button class="bk" aria-label="Back" onclick="exitSession()">'+I_BACK+'</button>'
+'<div class="shm"><div class="sht">'+(S.backfill?'Log · ':S.amend?'Edit · ':'')+esc(dayTitle(sess.name))+'</div><div class="shs num">'+elapsed+' · '+pl(sess.sets.length,'set')+'</div></div>'
+'<button class="fin'+(S.amend?' q':'')+'" onclick="finishAsk()">'+(S.backfill?'Save':S.amend?'Done':'Finish')+'</button></div></div>';
return hd+'<div class="co nopad">'+body+'</div>'}
function clearPV(exId){Object.keys(PV).forEach(k=>{if(k.indexOf(exId+'_')===0)delete PV[k]})}
function logSet(exId,i){
const sess=sessById(S.sid);if(!sess)return;
const entry=entryFor(sess,exId);if(!entry)return;
const ex=exOf(exId),key=exId+'_'+i;
seedPV(key,ex,entry,i,sess);
const pv=PV[key];
const ts=S.backfill?sess.startedAt+sess.sets.length*45000:Date.now();
if(!pv.r||pv.r<1){toast('Reps can\'t be 0');return}
sess.sets.push({exId,n:i+1,w:{v:+pv.w||0,u:unit()},reps:Math.round(pv.r),warmup:i<entry.warmups||undefined,amrap:entry.amrap||undefined,ts});
delete PV[key];sv();vibe(12);S.flash=exId+'_'+(i+1);
if(!S.amend){let rem=0;
entriesOf(sess).filter(e=>e.enabled).forEach(e=>{const tot=rowTotal(sess,e);
 rem+=Math.max(0,tot-workingSets(sess,e.exId).length)});
if(rem>0)startRest(restFor(entry,ex),esc(ex.name))}
rn();S.flash=null}

sheet('Rest · '+esc(ex.name),'Counts down after each logged set. Saved to your program.',
'<div class="stp" style="height:56px;margin-bottom:6px"><button class="stb" style="width:56px" data-hold data-fn="rscStep" data-args="[-15]">−</button><div class="stv num" id="rscV">'+rscCur()+'s</div><button class="stb" style="width:56px" data-hold data-fn="rscStep" data-args="[15]">+</button></div>'
+'<div class="shbtns"><button class="btn btn-p" onclick="closeOv();rn()">Done</button></div>')}

const sess=sessById(S.sid),ex=exOf(RSC.exId);
const t=sess?tpl(sess.templateId):null,e=t?t.entries.find(x=>x.exId===RSC.exId):null;

function rscStep(d){

/* ═══════════ TRAINING GUARDS ═══════════
   You build and adjust your lifts and mobility yourself, by feel. Nothing here progresses anything:
   there is no rung ladder, no advance budget, no auto-set-add, and no weight is ever suggested.
   What survives are two guards, and both can only SUBTRACT volume, temporarily, and say so on the
   card. Neither of them ever writes your saved template.
     · Auto-deload  - the trained-week backstop books the next full week easy:
                      lift sets display halved, sprints run easy, cardio minutes ease (floored at
                      min(template, 20), so a short day is never cut below 20 or rounded up).
     · Race taper   - Speed season plus a race date eases sprint and cardio volume into the race, with
                      quality held. Lifts are untouched by the taper.
   A Stop post-tap arms the next sprint to run easy. The recovery dial now tunes exactly one thing:
   how many trained weeks pass before an easy week lands. */
const ENG={TRAINED_MIN:2}; /* the flat-morning windows went with the pre-tap at contentRev 31 */
/* Every library tag maps to one muscle group or to none. Used ONLY by the Trends hard-sets-per-muscle metric — unmapped tags still count as themselves. */
const MUSCLE_MAP={'side delts':'sideDelt','rear delts':'rearDelt','upper back':'upperBack','back':'upperBack','lats':'upperBack','traps':'upperBack','hamstrings':'hams','quads':'quadsGlutes','glutes':'quadsGlutes','legs':'quadsGlutes','calves':'calves','core':'core','abs':'core','obliques':'core'};
const GROUP_NAME={sideDelt:'side delts',rearDelt:'rear delts',upperBack:'upper back',hams:'hamstrings',quadsGlutes:'quads + glutes',calves:'calves',core:'core'};
let ENG_DIRTY=false;
/* Master switch · OFF by default (held until J is cleared). Reads the flag WITHOUT creating engine state,
   so a dormant install never folds a verdict, fires a deload, or shows an engine number. */
function engineOn(){const p=(DB&&DB.programs)?prog():null;return!!(p&&p.engine&&p.engine.on)}
function engine(){const p=prog();if(!p.engine){p.engine={dial:1,start:tk()};ENG_DIRTY=true}return p.engine}
function dial(){return Math.min(1.4,Math.max(.6,engine().dial||1))}
function deloadEvery(){return Math.max(3,Math.round(5.5*dial()))}
function groupsOf(ex){const g=[];((ex&&ex.muscles)||[]).forEach(m=>{const k=MUSCLE_MAP[String(m).toLowerCase().trim()];if(k&&g.indexOf(k)<0)g.push(k)});return g}
/* ---- the one guard that touches a lift · it reads the template, it never writes it ----
   Every guard subtracts. prescSets can only ever return a number in [1, entry.sets], and returns
   entry.sets untouched on a normal day, on a 0-set row, on an AMRAP, on an ad-hoc add, and always
   when the engine is off. The engineOn() short-circuit is load-bearing: inDeloadWeek reads
   engine(), which would otherwise lazily create engine state on a dormant install. */
function prescSets(entry,dk){const n=entry.sets;
if(!engineOn()||entry.amrap||entry.synth||!(n>0))return n;
if(inDeloadWeek(dk))return Math.max(1,Math.ceil(n/2)); /* deload week · sets halve, rounded up */
return n}
/* The rep band a scheme declares ("3 × 12-15" → [12,15]), parsed from the scheme's REP half: a leading
   warmup clause ("2 wu + "), set count ("3 ×", typed × or x), or set range ("2-3 ×") is stripped first,
   so a rest/tempo/hold range later in the string ("· rest 45-60s") can never masquerade as the rep
   range. A plain authored rep ("3 × 12" → [12,12]) is its own floor; only when the scheme names no
   reps at all does defReps stand in. */
function repBand(e){let s=schemeOf(e).replace(/^\s*\d+\s*wu\s*\+\s*/i,'');
for(let i=0;i<2;i++){const g=/^\s*\d+(?:\s*[-–]\s*\d+)?\s*[×x](?=[\s\d])\s*/i.exec(s);if(!g)break;s=s.slice(g[0].length)} /* whatever count sits before a × (sets, a set range, a warmup row's or cluster prefix), it is never the reps · the × must head a space or digit, so an x starting a word never splits */
const r=/^\s*(\d+)\s*[-–]\s*(\d+)/.exec(s);if(r&&+r[2]>+r[1])return[+r[1],+r[2]];
const n=/^\s*(\d+)/.exec(s);if(n&&+n[1]>0)return[+n[1],+n[1]];
const d=e.defReps||10;return[d,d]}
/* The rep half of a scheme: "3 × 12-15/leg" → "12-15/leg". Keeps the template's own words
   ("/side", "/leg", "max"), and accepts a hand-typed "x" for the ×. The leading "N ×" is only
   stripped when N is really the set count: a warmup row writes its warmup count there
   ("2 × 15 · warm-up", sets 0), and a hand-written scheme need not agree with entry.sets at all.
   When it does not, fall back to repBand, the same parse prefill uses, so the deload line and the
   reps in the field always agree. The optional collapse to the bottom of the range ("12-15" → "12")
   went with the Flat-day rep ease it existed for, at contentRev 31. */
function repText(e){const m=/^\s*(\d+)\s*[×x]\s*(.+)$/i.exec(schemeOf(e));
if(m&&+m[1]===e.sets)return m[2];
if(e.amrap)return'max';
const b=repBand(e);
return b[0]===b[1]?String(b[0]):b[0]+'-'+b[1]}
function schemeEng(entry,dk){if(!engineOn()||entry.amrap||entry.synth||!(entry.sets>0))return schemeOf(entry); /* dormant, or a row no guard touches · the template exactly as written */
if(!inDeloadWeek(dk))return schemeOf(entry); /* a normal day shows the template exactly as written */

/* trendCapped (two flat mornings in four days · the sprint fatigue guard) and chronicFlat (three straight
   flat mornings · the deload trigger) both died with the pre-tap at contentRev 31. They read nothing but
   flat pre-taps, so with no pre-tap there is nothing left for them to count. The deload backstop below
   (deloadEvery trained weeks) is now the only way a deload books itself. */
function deloadWk(){const e=engine();return(e.deload&&e.deload.weekOf)||null}
function inDeloadWeek(dk){const w=deloadWk();return!!w&&weekMon(dk)===w}
function unlogDeload(w){const e=engine();if(e.deloadWeeks)e.deloadWeeks=e.deloadWeeks.filter(x=>x!==w)} /* a pending deload cancelled before it runs must leave no ghost in deloadWeeks · else lastNormalWeekLoad wrongly excludes that now-normal week and understates the ramp base */
function fireDeload(){const e=engine(); /* the backstop is the only caller left, so the old 'by' breadcrumb was a constant nothing read · dropped at the cr31 sweep */
if(e.deload&&e.deload.weekOf>=weekMon(tk()))return false; /* one at a time */
e.deload={weekOf:shiftDk(weekMon(tk()),7),at:tk()};(e.deloadWeeks=e.deloadWeeks||[]).push(e.deload.weekOf);ENG_DIRTY=true;return true} /* occupies the next full week · logs the week durably so its halved load never becomes a ramp base */
function trainedWeeks(){ /* completed Mon-weeks with ≥2 finished sessions, strictly after the anchor (engine start · last deload week · taper end), before this week */
const e=engine(),cur=weekMon(tk());
let anchor=weekMon(engAnchor()); /* engine start OR a fresh-block reset, whichever is later · a season change is NOT a rest, so it never pushes the clock back */
if(e.deload&&e.deload.weekOf>anchor)anchor=e.deload.weekOf;
if(e.taperEndedAt&&weekMon(e.taperEndedAt)>anchor)anchor=weekMon(e.taperEndedAt); /* E4 · taper + race + recovery reset the deload clock */
const m={};
DB.sessions.forEach(s=>{if(!s.finishedAt)return;const w=weekMon(s.date);if(w<=anchor||w>=cur)return;m[w]=(m[w]||0)+1});
return Object.keys(m).filter(w=>m[w]>=ENG.TRAINED_MIN).length}
function checkDeloadDue(){const e=engine();
if(taperState(tk()))return null; /* E4 · taper owns the race run-in, the deload clock freezes */
if(e.deload&&e.deload.weekOf>=weekMon(tk()))return null;
if(trainedWeeks()>=deloadEvery())return fireDeload()?'backstop':null;
return null}
function engTick(){if(!DB||!engineOn())return; /* dormant · no deload, no taper latch, no engine state created */
taperTick(); /* the taper latches or clears first · entry can abort a pending deload */
const fired=checkDeloadDue();
if(fired)toast('Deload week next week · earned rest, lighter by design');
maybeOfferReset(); /* after a long gap, quietly offer a fresh block */
if(ENG_DIRTY){ENG_DIRTY=false;sv()}}

/* ═══════════ THE GUARDS · deload, taper, cardio volume, resets ═══════════
   EVERY surface below is gated by engineOn(): a dormant install reaches none of it and creates no
   engine state, so with the switch off the app behaves exactly as it did before the engine existed.
   All state is lazy/nullable, so schemaVersion stays 1 and no logged history is ever touched. */
const SWIM={floor:20}; /* the shortest an eased cardio day goes (never above the template's own minutes) */
const TAPER={LEN:10,FLOOR:0.5,DECAY:3.0,RECOVER_H:48};
function dkDays(a,b){const x=a.split('-').map(Number),y=b.split('-').map(Number);return Math.round((new Date(y[0],y[1]-1,y[2])-new Date(x[0],x[1]-1,x[2]))/864e5)}
/* ---- cold-start · a reset makes the engine ignore everything before its date ---- */
function engAnchor(){const e=engine(),r=e.resetDate||'',s=e.start||tk();return r&&r>s?r:s}
/* ---- the last completed normal training week · the taper needs a real week behind it to run ---- */
function lastNormalWeekLoad(){const cur=weekMon(tk()),anc=weekMon(engAnchor()),dls=engine().deloadWeeks||[];let best=0;
weeklyLoad().forEach(w=>{if(w.wk>=cur||w.wk<anc||w.sessions<ENG.TRAINED_MIN||dls.indexOf(w.wk)>=0)return;best=w.load});return best}
/* ---- the cardio guard · the template's own minutes, eased. Taper wins any overlap, then a deload
   week. One cut only, never two. Every branch is clamped to the template base, so an eased day can
   never prescribe MORE than the day you wrote. ---- */
function cardioRx(dk,base){if(!engineOn()||!(base>0))return null;
const fl=Math.min(base,SWIM.floor),cut=d=>Math.min(base,Math.max(fl,d));
const ts=taperState(dk);
if(ts)return cut(Math.round(base*ts.scale));

return base}
/* ---- taper (E4) · a date-anchored volume curve that wraps the sprint engine, quality held ---- */
function taperEligible(){return engineOn()&&(prog().season||'reset')==='speed'}
function taperState(dk){if(!taperEligible())return null;const h=prog().horizonDate;if(!h)return null;
if(!lastNormalWeekLoad())return null; /* fresh / just-reset blob → run the race on feel, no taper */
const daysTo=dkDays(dk,h);if(daysTo<0||daysTo>TAPER.LEN)return null;
const e=engine(),eff=(e.taperFor===h&&e.taperLen)?e.taperLen:Math.min(TAPER.LEN,Math.max(1,daysTo));
const pgs=Math.min(1,Math.max(0,1-daysTo/Math.max(1,eff)));
let scale=TAPER.FLOOR+(1-TAPER.FLOOR)*Math.exp(-TAPER.DECAY*pgs);scale=Math.min(1,Math.max(TAPER.FLOOR,scale));

function taperTick(){const p=prog(),e=engine();
if((p.season||'reset')!=='speed'||!p.horizonDate){if(e.taperFor){delete e.taperFor;delete e.taperLen;ENG_DIRTY=true}return}

if(daysTo<0){p.horizonDate=null;e.taperEndedAt=tk();delete e.taperFor;delete e.taperLen;ENG_DIRTY=true;return} /* race passed · taper + race were the deload */
if(daysTo>TAPER.LEN||!lastNormalWeekLoad())return;
if(dayPost(tk())==='stop'&&dayPost(shiftDk(tk(),-1))==='stop'){p.horizonDate=null;e.taperEndedAt=tk();delete e.taperFor;delete e.taperLen;ENG_DIRTY=true;return} /* two Stops in a row · end the taper early */

/* ═══════════ SPRINT WINDOW · the sprint day runs like a lift session: one row per rep, tick them off as you run ═══════════ */
function sprPersist(){try{
if(SPR&&CV&&CV.plan&&SPR.dk===CV.dk){SPR={dk:SPR.dk,startedAt:SPR.startedAt,plan:CV.plan.slice(),done:CV.done||0,eff:CV.eff,pain:CV.pain,ready:CV.ready||'',fallback:CV.fallback?1:0,menuId:CV.menuId||null,season:CV.season||null};
localStorage.setItem('blocks_spr',JSON.stringify(SPR))}
else if(!SPR)localStorage.removeItem('blocks_spr')}catch(e){}}
function restoreSpr(){try{const r=JSON.parse(localStorage.getItem('blocks_spr')||'null');SPR=null;
if(!(r&&r.plan&&r.plan.length&&r.startedAt)){localStorage.removeItem('blocks_spr');return}
const s0=getCardioSess(r.dk,false);
if(s0&&s0.sprints){localStorage.removeItem('blocks_spr');return} /* already saved · the mirror is stale */
if(r.dk===tk()){SPR=r;return}
if(r.done>0&&r.dk<tk()){ /* the window crossed midnight (or was never finished) · bank the run reps as that day's session instead of deleting them */
const L=r.plan.slice(0,r.done),s=getCardioSess(r.dk,true);
s.startedAt=r.startedAt;s.finishedAt=Math.min(r.startedAt+Math.min(5400000,(r.done+1)*240000),Date.now());
s.sprints={reps:L.length,distM:Math.max.apply(null,L),effortPct:r.eff,legs:L.slice(),pain:(r.pain===''||r.pain==null)?null:r.pain,ready:r.ready||null,fallback:r.fallback?1:0,menuId:r.menuId||null,season:r.season||null};
sv();setTimeout(()=>toast('Sprints from '+fmtDk(r.dk)+' saved · '+L.length+' rep'+(L.length>1?'s':'')),700)}
localStorage.removeItem('blocks_spr')}catch(e){}}
function startSprints(dk){
const ct=prog().templates.find(x=>x.kind==='cardio');if(!ct)return;
const s=S.view==='detail'?sessById(S.det):getCardioSess(dk,false);
if(!CV||CV.dk!==dk){CV=null;ensureCV(dk,ct,s)}
CV.plan=Array(Math.max(1,Math.round(+CV.reps)||1)).fill(Math.min(1000,Math.max(10,Math.round(+CV.dist)||50)));CV.done=0;
const live=dk===tk()&&S.view!=='detail';
if(live){SPR={dk,startedAt:Date.now()};sprPersist()}
S.sprAmend=!live;S.sprFrom=S.view==='detail'?'detail':'today';S.sprEdit=null;S.view='sprint';rn()}
function resumeSprints(){const dk=tk();if(!SPR||SPR.dk!==dk){rn();return}
if(!CV||CV.dk!==dk||!CV.plan){const ct=prog().templates.find(x=>x.kind==='cardio');
CV=null;ensureCV(dk,ct,getCardioSess(dk,false));
CV.plan=(SPR.plan||[]).slice();CV.done=Math.min(SPR.done||0,CV.plan.length);
if(SPR.eff!=null)CV.eff=SPR.eff;if(SPR.pain!=null&&SPR.pain!=='')CV.pain=SPR.pain;if(SPR.ready)CV.ready=SPR.ready;if(SPR.menuId)CV.menuId=SPR.menuId;if(SPR.season)CV.season=SPR.season;CV.fallback=SPR.fallback?1:0}
S.sprAmend=false;S.sprFrom='today';S.sprEdit=null;S.view='sprint';rn()}

const ct=prog().templates.find(x=>x.kind==='cardio');if(!ct)return;
const s=S.view==='detail'?sessById(S.det):getCardioSess(dk,false);
const sp=s&&s.sprints;if(!sp)return;
CV=null;ensureCV(dk,ct,s); /* seeds eff/pain/menu/season from the saved record */
CV.plan=sp.legs&&sp.legs.length?sp.legs.slice():Array(Math.max(1,sp.reps||1)).fill(Math.min(1000,Math.max(10,sp.distM||50)));
CV.done=CV.plan.length;
S.sprAmend=true;S.sprFrom=S.view==='detail'?'detail':'today';S.sprEdit=null;S.view='sprint';rn()}
function exitSprint(){S.sprEdit=null;
if(S.sprAmend){S.sprAmend=false;CV=null;
if(S.sprFrom==='detail')S.view='detail';else{S.view='tabs';S.tab='today'}rn();return}
S.view='tabs';S.tab='today';rn()} /* live keeps running · the Today card offers Continue */
function sprStep(i,d){if(!CV||!CV.plan||CV.plan[i]==null)return;

/* Season · the one quarterly dial. E1 stores it; E2 keys the volume bands and re-anchor off it. */
function seasonSheet(){const cur=prog().season||'reset';
let b='<div class="shbtns">'+Object.keys(SEASONS).map(k=>{const s=SEASONS[k];
return'<button class="btn '+(cur===k?'btn-p':'btn-o')+'" onclick="setSeason(\''+k+'\')">'+s.name+' · '+s.cal+'<span style="display:block;font-size:16px;font-weight:500;margin-top:2px">'+s.ds+'</span></button>'}).join('')+'</div>';
sheet('Season','The one quarterly dial · sprint stays the spine',b)}
function setSeason(k){if(!SEASONS[k])return;const p=prog();
if((p.season||'reset')===k){closeOv();return}
CV=null; /* a season change invalidates any sprint card CV picked under the old season */
p.season=k; /* the season is a label plus the taper's eligibility gate · it eases nothing, so it never re-anchors the easy-week clock and never cancels a pending deload */
sv();vibe(10);closeOv();rn();toast('Season · '+SEASONS[k].name)}

function edHdr(t,s,fn){return'<div class="shd"><div class="shdi"><button class="bk" aria-label="Back" onclick="'+fn+'">'+I_BACK+'</button><div class="shm"><div class="sht">'+t+'</div>'+(s?'<div class="shs">'+s+'</div>':'')+'</div></div></div>'}
function progSheet(){
const p=prog();
let b='<div class="flab" style="margin-top:0">Name</div><input class="tin" value="'+esc(p.name)+'" onchange="prog().name=this.value;sv();rn()">'
+'<div class="flab">Subtitle</div><input class="tin" value="'+esc(p.subtitle||'')+'" onchange="prog().subtitle=this.value;sv();rn()">'
+'<div class="shbtns">';
DB.programs.filter(x=>x.id!==p.id&&!x.archived).forEach(x=>{b+='<button class="btn btn-o" onclick="switchProg(\''+x.id+'\')">Switch to '+esc(x.name)+'</button>'});
DB.programs.filter(x=>x.archived).forEach(x=>{b+='<button class="btn btn-o" onclick="unarchProg(\''+x.id+'\')">Restore '+esc(x.name)+'</button>'});
b+='<button class="btn btn-o" onclick="dupProg()">Duplicate program</button>'
+'<button class="btn btn-o" onclick="newProg()">New blank program</button>';
if(DB.programs.filter(x=>!x.archived).length>1)b+='<button class="btn btn-d" onclick="archProg()">Archive this program</button>';
b+='<button class="btn btn-p" onclick="closeOv()">Done</button></div>';
sheet('Program','Edits save instantly.',b)}
function switchProg(pid){DB.activeProgramId=pid;CV=null;sv();closeOv();rn();toast('Program switched')}
function unarchProg(pid){const p=DB.programs.find(x=>x.id===pid);if(p)p.archived=false;sv();closeOv();rn();toast('Restored')}
function dupProg(){
const src=prog(),c=JSON.parse(JSON.stringify(src));
c.id=id('p');c.name=src.name+' copy';c.archived=false;
const map={};
(c.templates||[]).forEach(t=>{const nid=id('t')+Math.random().toString(36).slice(2,5);map[t.id]=nid;t.id=nid});
Object.keys(c.schedule||{}).forEach(d=>{const v=c.schedule[d];if(v&&map[v])c.schedule[d]=map[v]});
delete c.engine;delete c.liftPlan;delete c.cardioPlan; /* the copy starts with fresh engine state · the last two are retired blobs a pre-v38 program may still carry */
DB.programs.push(c);DB.activeProgramId=c.id;sv();closeOv();rn();toast('Duplicated · now active')}
function newProg(){
const np={id:id('p'),name:'New Program',subtitle:'',schedule:{0:null,1:null,2:null,3:null,4:null,5:null,6:null},
templates:[],checklists:{daily:[],dailyNoteAm:'',dailyNotePm:'',mobility:[],therapist:[]},reference:[]};
DB.programs.push(np);DB.activeProgramId=np.id;sv();closeOv();rn();toast('New program · build it from here')}
function archProg(){
const p=prog();p.archived=true;
const nxt=DB.programs.find(x=>!x.archived);
if(!nxt){p.archived=false;toast('This is your only program');return}
DB.activeProgramId=nxt.id;sv();closeOv();rn();toast('Archived · switched to '+nxt.name)}

function trendChart(ser,useReps){
const W=520,H=232,L=52,R=16,Tp=32,B=34; /* frame sized so the in-SVG type lands ~11px once the 520-unit box scales to a ~310px card */
const pts=ser.map(p=>({t:p.t,v:useReps?p.mxR:rndDisp(toU(p.topW,'lb',unit()),unit()),e1:p.e1?rndDisp(toU(p.e1,'lb',unit()),unit()):0}));
const showE1=!useReps&&S.e1;
let vmin=Infinity,vmax=-Infinity;
pts.forEach(p=>{vmin=Math.min(vmin,p.v);vmax=Math.max(vmax,p.v);if(showE1&&p.e1){vmin=Math.min(vmin,p.e1);vmax=Math.max(vmax,p.e1)}});
if(vmin===vmax){vmin-=5;vmax+=5}
const pad=(vmax-vmin)*.14;vmin=Math.max(0,vmin-pad);vmax+=pad;
/* snap the axis to a round step so the gridline labels read 50/70/90, not 57/72/87 */
const _raw=(vmax-vmin)/3,_mag=Math.pow(10,Math.floor(Math.log10(_raw))),_k=_raw/_mag;
const _step=(_k<1.5?1:_k<3?2:_k<7?5:10)*_mag;
vmin=Math.max(0,Math.floor(vmin/_step)*_step);vmax=Math.ceil(vmax/_step)*_step;
const t0=pts[0].t,t1=pts[pts.length-1].t,tr=Math.max(1,t1-t0);
const X=t=>pts.length===1?(L+(W-L-R)/2):L+(t-t0)/tr*(W-L-R);
const Y=v=>Tp+(1-(v-vmin)/(vmax-vmin))*(H-Tp-B);
const path=a=>{
if(a.length<3)return a.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
let d='M'+X(a[0].t).toFixed(1)+' '+Y(a[0].v).toFixed(1);
for(let i=0;i<a.length-1;i++){const p0=a[Math.max(0,i-1)],p1=a[i],p2=a[i+1],p3=a[Math.min(a.length-1,i+2)];
const lo=Math.min(Y(p1.v),Y(p2.v)),hi=Math.max(Y(p1.v),Y(p2.v));
const c1y=Math.max(lo,Math.min(hi,Y(p1.v)+(Y(p2.v)-Y(p0.v))/6)),c2y=Math.max(lo,Math.min(hi,Y(p2.v)-(Y(p3.v)-Y(p1.v))/6));
d+='C'+(X(p1.t)+(X(p2.t)-X(p0.t))/6).toFixed(1)+' '+c1y.toFixed(1)+' '+(X(p2.t)-(X(p3.t)-X(p1.t))/6).toFixed(1)+' '+c2y.toFixed(1)+' '+X(p2.t).toFixed(1)+' '+Y(p2.v).toFixed(1)}
return d};
const FF="'Helvetica Neue',Arial,sans-serif"; /* chart type: the 520-unit box renders ~361px wide, a .69 scale · 23 SVG units land at ~16px, the ladder floor */
let h='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
[vmax,(vmin+vmax)/2,vmin].forEach(v=>{const y=Y(v);
h+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="#2B2B2E" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y+6).toFixed(1)+'" text-anchor="end" font-size="23" fill="#CDCDC8" font-family="'+FF+'">'+Math.round(v)+'</text>'});
if(showE1)h+='<path d="'+path(pts.filter(p=>p.e1).map(p=>({t:p.t,v:p.e1})))+'" fill="none" stroke="#CDCDC8" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7"/>';
h+='<path d="'+path(pts)+'" fill="none" stroke="#ff6f2e" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
pts.forEach((p,i)=>{const last=i===pts.length-1;
h+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(last?4.2:3.4)+'" fill="#0A0A0A" stroke="'+(last?'#ffa14d':'#ff6f2e')+'" stroke-width="2.2"/>'});
const lp=pts[pts.length-1],lx=X(lp.t),ly=Y(lp.v);
h+='<text x="'+Math.min(lx,W-R-6).toFixed(1)+'" y="'+(ly-15).toFixed(1)+'" text-anchor="'+(lx>W-60?'end':'middle')+'" font-size="26" font-weight="700" fill="#ffa14d" font-family="'+FF+'">'+lp.v+'</text>';
const yr=ser[0].date.slice(0,4)!==ser[ser.length-1].date.slice(0,4);
h+='<text x="'+L+'" y="'+(H-9)+'" font-size="23" fill="#CDCDC8" font-family="'+FF+'">'+fmtDk(ser[0].date)+(yr?' ’'+ser[0].date.slice(2,4):'')+'</text>';
if(ser.length>1)h+='<text x="'+(W-R)+'" y="'+(H-9)+'" text-anchor="end" font-size="23" fill="#CDCDC8" font-family="'+FF+'">'+fmtDk(ser[ser.length-1].date)+(yr?' ’'+ser[ser.length-1].date.slice(2,4):'')+'</text>';
if(showE1)h+='<text x="'+(W-R)+'" y="'+(Tp-6)+'" text-anchor="end" font-size="23" fill="#CDCDC8" font-family="'+FF+'">est 1RM – –</text>';
return'<div class="chartw">'+h+'</svg></div>'}
